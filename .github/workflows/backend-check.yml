name: Check AI Backend
on:
  workflow_dispatch:
  push:
    paths:
      - 'server/**'
      - 'render.yaml'
      - '.github/workflows/backend-check.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'render.yaml'
      - '.github/workflows/backend-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package.json
      - name: Install backend dependencies
        run: npm install --prefix server
      - name: Syntax check
        run: npm run check --prefix server
