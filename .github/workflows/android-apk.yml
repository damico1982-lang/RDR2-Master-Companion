name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'android-native/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p android-native assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Frontier-Guide-debug-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
